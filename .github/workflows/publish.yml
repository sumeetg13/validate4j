name: Publish to Maven Central

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to the Sonatype Central Portal
        # Gradle's signing plugin only accepts the 8-character short key id, so trim whatever
        # form the secret holds (short id, long id or full fingerprint) to its last 8 hex characters.
        run: |
          KEY_ID="${GPG_KEY_ID_RAW//[^0-9A-Fa-f]/}"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${KEY_ID: -8}"
          ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache
        env:
          GPG_KEY_ID_RAW: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
